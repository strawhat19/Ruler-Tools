<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="ruler-title ruler-description">
  <title id="ruler-title">Ruler Tools — Classic Crown Protractor</title>
  <desc id="ruler-description">A broad gold royal crown has five upward points with small rounded finials, tallest at the center and mirrored on each side. The slate protractor, white opening, thin connected gold graduations and gold pivot are unchanged from V7.</desc>
  <g id="symmetric-crown-protractor-mark">
    <path id="preserved-protractor-outer-rim" d="M40 138a56 56 0 0 1 112 0Z" fill="#F5BD4F"/>
    <path id="classic-crown-silhouette" d="M52 104L38 64C45 70 52 76 60 78L67 48C72 58 77 66 82 69L96 36L110 69C115 66 120 58 125 48L132 78C140 76 147 70 154 64L140 104Z" fill="#F5BD4F"/>
    <g id="classic-crown-rounded-finials" fill="#F5BD4F">
      <circle id="crown-finial-outer-left" cx="38" cy="64" r="3"/>
      <circle id="crown-finial-inner-left" cx="67" cy="48" r="3"/>
      <circle id="crown-finial-center" cx="96" cy="36" r="3"/>
      <circle id="crown-finial-inner-right" cx="125" cy="48" r="3"/>
      <circle id="crown-finial-outer-right" cx="154" cy="64" r="3"/>
    </g>
    <path id="symmetric-protractor-arc" d="M48 138a48 48 0 0 1 96 0Z" fill="#253F68"/>
    <path id="symmetric-protractor-opening" d="M68 138a28 28 0 0 1 56 0Z" fill="#FFFFFF"/>
    <g id="connected-tapered-graduations" fill="#F5BD4F">
      <path id="crown-graduation-1" d="M53.149 112.221L65.689 120.5L52.249 113.779Z"/>
      <path id="crown-graduation-2" d="M71.779 94.249L78.5 107.689L70.221 95.149Z"/>
      <path id="crown-graduation-3" d="M96.9 88L96 103L95.1 88Z"/>
      <path id="crown-graduation-4" d="M121.779 95.149L113.5 107.689L120.221 94.249Z"/>
      <path id="crown-graduation-5" d="M139.751 113.779L126.311 120.5L138.851 112.221Z"/>
    </g>
    <circle id="symmetric-protractor-pivot" cx="96" cy="138" r="5" fill="#F5BD4F"/>
  </g>
  <text id="ruler-wordmark" x="187" y="91" fill="#F5BD4F" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" letter-spacing="1">RULER</text>
  <text id="tools-wordmark" x="191" y="129" fill="#B67714" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="11">TOOLS</text>
</svg>
