<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title description">
  <title id="title">Ruler Tools — Five Point Crown Protractor</title>
  <desc id="description">A gold crown-protractor silhouette gains two outer crown points around a slate measurement arc, with gold graduations and a gold Ruler wordmark.</desc>
  <path id="five-point-crown-silhouette" d="M40 138A56 56 0 0 1 50 106L31 82 59 94 49 68 73 85 96 43 119 85 143 68 133 94 161 82 142 106A56 56 0 0 1 152 138Z" fill="#F5BD4F"/>
  <path id="five-point-protractor-arc" d="M48 138a48 48 0 0 1 96 0Z" fill="#253F68"/>
  <path id="five-point-protractor-opening" d="M68 138a28 28 0 0 1 56 0Z" fill="#FFFFFF"/>
  <path id="five-point-protractor-graduations" d="M57 116 65 120m-2-15 7 7m5-15 4 8m17-12v10m21-6-4 8m16 0-7 7m13 4-8 4" fill="none" stroke="#F5BD4F" stroke-width="3" stroke-linecap="round"/>
  <circle id="five-point-protractor-pivot" cx="96" cy="138" r="5" fill="#F5BD4F"/>
  <text id="five-point-ruler-wordmark" x="187" y="91" fill="#F5BD4F" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" letter-spacing="1">RULER</text>
  <text id="five-point-tools-wordmark" x="191" y="129" fill="#B67714" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" letter-spacing="11">TOOLS</text>
</svg>
